<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>共享记忆 · 查看与编辑</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --border:#e5e7eb; --text:#0f172a; --muted:#64748b;
    --accent:#6c5ce7; --accent-soft:#f1efff; --danger:#dc2626; --ok:#16a34a;
    --note:#6b7280; --profile:#2563eb; --preference:#7c3aed; --goal:#0891b2;
    --project:#16a34a; --task:#d97706; --message:#64748b;
    --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1020; --panel:#121a2e; --border:#243049; --text:#e2e8f0; --muted:#94a3b8;
      --accent:#8b7cf6; --accent-soft:#1e1b3a; --danger:#f87171; --ok:#4ade80;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
      --note:#9ca3af; --profile:#60a5fa; --preference:#a78bfa; --goal:#22d3ee;
      --project:#4ade80; --task:#fbbf24; --message:#94a3b8;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:24px 18px 80px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .stats b{color:var(--text)}
  h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .muted{color:var(--muted)}
  textarea,input[type=text],input[type=password],select{
    width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:9px 11px;font:inherit;outline:none
  }
  textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row > .grow{flex:1 1 220px}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px 13px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--danger)}
  button.small{padding:4px 9px;font-size:12px;border-radius:8px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .grow{flex:1 1 240px}
  .item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
  .item-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .kind{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor;text-transform:lowercase}
  .kind.note{color:var(--note)} .kind.profile{color:var(--profile)} .kind.preference{color:var(--preference)}
  .kind.goal{color:var(--goal)} .kind.project{color:var(--project)} .kind.task{color:var(--task)} .kind.message{color:var(--message)}
  .meta{color:var(--muted);font-size:12px}
  .item-text{white-space:pre-wrap;word-break:break-word;margin:2px 0 6px}
  .tags{margin-top:4px}
  .tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:0 7px;margin:0 4px 4px 0}
  .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .empty{color:var(--muted);text-align:center;padding:28px 0}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
  #toast.show{opacity:1}
  #tokenPanel{display:none}
  #tokenPanel.show{display:block}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:22px}
  a{color:var(--accent)}
  .hidden{display:none!important}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tab{background:transparent;border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .item.deleted{opacity:.72;border-style:dashed}
  .history{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
  .rev{border:1px solid var(--border);border-radius:8px;padding:6px 9px;margin:6px 0}
  .rev .item-text{font-size:12.5px;margin:2px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>共享记忆 <span class="badge">AI 跨平台记忆增强</span></h1>
      <div class="sub">查看 / 编辑跨会话、跨应用的记忆 · <span id="apiBase" class="muted"></span></div>
    </div>
    <div class="row">
      <button id="refreshBtn" title="刷新">刷新</button>
      <button id="exportBtn" title="导出 JSONL 备份">导出</button>
      <button id="tokenBtn" title="设置访问 token">Token</button>
    </div>
  </header>

  <div class="card" id="statsCard">
    <div class="stats" id="stats"><span class="muted">加载中…</span></div>
  </div>

  <div class="card" id="tokenPanel">
    <h2>访问 token</h2>
    <div class="sub" style="margin-bottom:8px">服务端设置了 apiToken，填写后才能读写。token 只保存在本浏览器 localStorage。</div>
    <div class="row">
      <input type="password" id="tokenInput" class="grow" placeholder="Bearer token"/>
      <button class="primary" id="tokenSave">保存并重试</button>
      <button id="tokenClear">清除</button>
    </div>
  </div>

  <div class="card">
    <h2>当前正在做的事</h2>
    <textarea id="focusText" rows="2" placeholder="一句话描述当前任务"></textarea>
    <div style="height:8px"></div>
    <input type="text" id="focusSteps" placeholder="下一步（用逗号分隔，可留空）"/>
    <div class="actions">
      <button class="primary" id="focusSave">保存焦点</button>
      <button id="focusClear">清除焦点</button>
      <span class="meta" id="focusMeta"></span>
    </div>
  </div>

  <div class="card">
    <h2>备份与恢复</h2>
    <div class="sub" id="backupMeta">正在读取备份状态…</div>
    <div class="actions" style="margin-top:8px">
      <button class="primary" id="backupNow">立即备份</button>
      <button id="refreshBackups">刷新</button>
    </div>
    <div id="backupList" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>记忆列表</h2>
    <div class="tabs">
      <button class="tab active" id="tabActive">记忆</button>
      <button class="tab" id="tabTrash">回收站</button>
      <button class="tab hidden" id="emptyTrash" style="margin-left:auto;color:var(--danger)">清空回收站</button>
    </div>
    <div class="toolbar">
      <input type="text" id="search" class="grow" placeholder="搜索记忆内容或标签…"/>
      <select id="sortMode" style="flex:0 0 120px">
        <option value="">相关度优先</option>
        <option value="newest">最新优先</option>
      </select>
      <select id="kindFilter" style="flex:0 0 130px">
        <option value="">全部类型</option>
        <option value="profile">profile 画像</option>
        <option value="preference">preference 偏好</option>
        <option value="goal">goal 目标</option>
        <option value="project">project 项目</option>
        <option value="task">task 任务</option>
        <option value="note">note 笔记</option>
        <option value="message">message 原话</option>
      </select>
    </div>
    <div id="list"></div>
    <div class="actions" style="justify-content:center">
      <button id="moreBtn" class="hidden">加载更多</button>
    </div>
  </div>

  <div class="foot">本地服务 · 数据只存在 <code>~/.dsh/shared-memory/</code> · 原话缓存只读（可删除）</div>
</div>
<div id="toast"></div>

<script>
(() => {
  const BASE = location.pathname.replace(/\/ui\/?$/, '') || '/dsh-memory'
  const state = { q: '', kind: '', sort: '', view: 'active', offset: 0, limit: 50, total: 0, items: [], editing: null, historyFor: null, token: localStorage.getItem('sm-token') || '' }
  const $ = (id) => document.getElementById(id)
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n }
  let toastTimer = null
  function toast(msg, ms = 2200) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show')
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms)
  }
  const fmt = (ts) => { const d = Date.now() - ts; if (d < 6e4) return '刚刚'; if (d < 36e5) return Math.floor(d / 6e4) + ' 分钟前'; if (d < 864e5) return Math.floor(d / 36e5) + ' 小时前'; return Math.floor(d / 864e5) + ' 天前' }
  const shortId = (id) => (id || '').replace(/^(mem|msg)_/, '').slice(0, 8)

  function highlightInto(node, text, q) {
    const query = (q || '').trim()
    if (!query) { node.textContent = text; return }
    const terms = [query]
    for (const part of query.split(/\s+/)) if (part && !terms.includes(part)) terms.push(part)
    const lower = String(text).toLowerCase()
    let index = 0
    while (index < text.length) {
      let found = -1
      let foundLen = 0
      for (const term of terms) {
        const at = lower.indexOf(term.toLowerCase(), index)
        if (at >= 0 && (found < 0 || at < found || (at === found && term.length > foundLen))) {
          found = at
          foundLen = term.length
        }
      }
      if (found < 0) { node.append(document.createTextNode(text.slice(index))); break }
      if (found > index) node.append(document.createTextNode(text.slice(index, found)))
      node.append(el('mark', null, text.slice(found, found + foundLen)))
      index = found + foundLen
    }
  }

  async function api(path, opts = {}) {
    const headers = Object.assign({}, opts.headers || {})
    if (opts.body) headers['content-type'] = 'application/json'
    if (state.token) headers.authorization = 'Bearer ' + state.token
    const res = await fetch(BASE + path, Object.assign({}, opts, { headers }))
    if (res.status === 401) { $('tokenPanel').classList.add('show'); throw new Error('需要访问 token') }
    if (!res.ok) {
      let msg = 'HTTP ' + res.status
      try { const j = await res.json(); msg = (j.error && j.error.message) || msg } catch {}
      throw new Error(msg)
    }
    return res.json()
  }

  function setStats(h) {
    const s = h.stats || {}
    const wrap = $('stats'); wrap.textContent = ''
    const add = (label, value) => { const n = el('span'); n.append(el('b', null, String(value)), document.createTextNode(' ' + label)); wrap.append(n) }
    add('条记忆', s.memories || 0); add('条原话', s.messages || 0); add('个会话', s.sessions || 0)
    add('回收站', s.trash || 0); add('焦点', s.hasFocus ? '有' : '无')
    const v = el('span', 'muted', 'v' + (h.version || '')); wrap.append(v)
    $('apiBase').textContent = location.origin + BASE
  }

  async function loadHealth() {
    try { setStats(await api('/health')) } catch (e) { toast(e.message) }
  }

  async function loadFocus() {
    try {
      const j = await api('/api/current')
      const f = j.focus
      $('focusText').value = f ? f.text : ''
      $('focusSteps').value = f ? (f.nextSteps || []).join('，') : ''
      $('focusMeta').textContent = f ? (f.updatedBy || '') + ' · ' + fmt(f.updatedAt) : ''
    } catch (e) { toast(e.message) }
  }

  function renderList(reset) {
    if (reset) { state.items = []; state.offset = 0; $('list').textContent = '' }
    state.items = state.items.concat(res.items)
    state.total = res.total
    state.offset = state.items.length
    const list = $('list')
    if (!state.items.length) {
      list.append(el('div', 'empty', state.q || state.kind ? '没有匹配的记忆' : '还没有记忆，先去聊会儿吧'))
    }
    for (const item of res.items) list.append(renderItem(item))
    $('moreBtn').classList.toggle('hidden', state.items.length >= state.total)
  }

  function renderItem(item) {
    const deleted = Boolean(item.deletedAt)
    const box = el('div', 'item' + (deleted ? ' deleted' : ''))
    const head = el('div', 'item-head')
    head.append(el('span', 'kind ' + item.kind, item.kind))
    head.append(el('span', 'meta', (item.source && item.source.app ? item.source.app + ' · ' : '') + fmt(item.createdAt)))
    head.append(el('span', 'meta', '#' + shortId(item.id)))
    if (deleted) head.append(el('span', 'meta', '已删除 · ' + fmt(item.deletedAt)))
    const actions = el('div', 'actions')
    if (state.editing === item.id) {
      const text = el('textarea'); text.rows = 3; text.value = item.text
      const kind = el('select'); ['note','profile','preference','goal','project','task'].forEach(k => { const o = el('option', null, k); o.value = k; if (k === item.kind) o.selected = true; kind.append(o) })
      const tags = el('input'); tags.type = 'text'; tags.value = (item.tags || []).join(', '); tags.placeholder = '标签，逗号分隔'
      const save = el('button', 'primary small', '保存'); save.onclick = () => updateItem(item, text.value, kind.value, tags.value)
      const cancel = el('button', 'small', '取消'); cancel.onclick = () => { state.editing = null; refreshList() }
      box.append(head, text, kind, tags, actions)
      actions.append(save, cancel)
      return box
    }
    head.append(el('span', 'meta', item.updatedAt ? '已编辑' : ''))
    if (item.usage && item.usage.count) head.append(el('span', 'meta', '用过 ' + item.usage.count + ' 次'))
    box.append(head)
    const body = el('div', 'item-text')
    highlightInto(body, item.text, state.q)
    box.append(body)
    if (item.tags && item.tags.length) {
      const tags = el('div', 'tags'); for (const t of item.tags) tags.append(el('span', 'tag', t)); box.append(tags)
    }
    if (deleted) {
      const restore = el('button', 'small primary', '恢复'); restore.onclick = () => restoreItem(item)
      const purge = el('button', 'small danger', '彻底删除'); purge.onclick = () => purgeItem(item)
      actions.append(restore, purge)
      box.append(actions)
      return box
    }
    if (item.kind !== 'message') {
      const edit = el('button', 'small', '编辑'); edit.onclick = () => { state.editing = item.id; state.historyFor = null; refreshList() }
      actions.append(edit)
    }
    if (Array.isArray(item.revisions) && item.revisions.length) {
      const hist = el('button', 'small', '历史 (' + item.revisions.length + ')')
      hist.onclick = () => { state.historyFor = state.historyFor === item.id ? null : item.id; state.editing = null; refreshList() }
      actions.append(hist)
    }
    const del = el('button', 'small danger', '删除'); del.onclick = () => removeItem(item)
    actions.append(del)
    box.append(actions)
    if (state.historyFor === item.id) box.append(renderHistory(item))
    return box
  }

  function renderHistory(item) {
    const wrap = el('div', 'history')
    wrap.append(el('div', 'meta', '编辑历史（恢复会覆盖当前内容，并把本次修改记成新的一版）'))
    item.revisions.slice().reverse().forEach((rev, index) => {
      const row = el('div', 'rev')
      row.append(el('div', 'meta', 'v' + (item.revisions.length - index) + ' · ' + fmt(rev.updatedAt) + ' · ' + rev.kind))
      const revBody = el('div', 'item-text')
      highlightInto(revBody, rev.text, state.q)
      row.append(revBody)
      if (rev.tags && rev.tags.length) { const tags = el('div', 'tags'); for (const t of rev.tags) tags.append(el('span', 'tag', t)); row.append(tags) }
      const btn = el('button', 'small', '恢复此版本'); btn.onclick = () => restoreRevision(item, rev)
      row.append(btn)
      wrap.append(row)
    })
    return wrap
  }

  async function restoreRevision(item, rev) {
    try {
      await api('/api/update', { method: 'POST', body: JSON.stringify({ id: item.id, text: rev.text, kind: rev.kind, tags: rev.tags }) })
      state.historyFor = null
      await refreshList(); await loadHealth(); toast('已恢复该版本')
    } catch (e) { toast(e.message) }
  }

  async function restoreItem(item) {
    try {
      await api('/api/restore', { method: 'POST', body: JSON.stringify({ id: item.id }) })
      await refreshList(); await loadHealth(); toast('已恢复')
    } catch (e) { toast(e.message) }
  }

  async function emptyTrash() {
    if (!confirm('清空回收站？里面的记忆会被彻底删除，无法恢复。')) return
    try {
      await api('/api/purge-trash', { method: 'POST', body: '{}' })
      await refreshList(); await loadHealth(); toast('回收站已清空')
    } catch (e) { toast(e.message) }
  }

  async function purgeItem(item) {
    if (!confirm('彻底删除这条记忆？此操作不可恢复。\n\n' + item.text.slice(0, 120))) return
    try {
      await api('/api/forget', { method: 'POST', body: JSON.stringify({ id: item.id, purge: true }) })
      await refreshList(); await loadHealth(); toast('已彻底删除')
    } catch (e) { toast(e.message) }
  }

  async function refreshList() {
    try {
      const params = new URLSearchParams({ limit: String(state.limit), offset: '0' })
      if (state.q) params.set('q', state.q)
      if (state.kind) params.set('kind', state.kind)
      if (state.view === 'trash') params.set('deleted', '1')
      if (state.sort) params.set('sort', state.sort)
      const res = await api('/api/items?' + params.toString())
      state.offset = 0
      state.items = res.items
      state.total = res.total
      const list = $('list'); list.textContent = ''
      if (!state.items.length) list.append(el('div', 'empty', state.view === 'trash' ? '回收站是空的' : (state.q || state.kind ? '没有匹配的记忆' : '还没有记忆，先去聊会儿吧')))
      for (const item of res.items) list.append(renderItem(item))
      $('moreBtn').classList.toggle('hidden', state.items.length >= state.total)
    } catch (e) { toast(e.message) }
  }

  async function loadMore() {
    try {
      const params = new URLSearchParams({ limit: String(state.limit), offset: String(state.offset) })
      if (state.q) params.set('q', state.q)
      if (state.kind) params.set('kind', state.kind)
      if (state.view === 'trash') params.set('deleted', '1')
      if (state.sort) params.set('sort', state.sort)
      const res = await api('/api/items?' + params.toString())
      renderList(res)
    } catch (e) { toast(e.message) }
  }

  async function updateItem(item, text, kind, tags) {
    try {
      await api('/api/update', { method: 'POST', body: JSON.stringify({ id: item.id, text: text, kind: kind, tags: tags.split(',').map(s => s.trim()).filter(Boolean) }) })
      state.editing = null
      await refreshList(); await loadHealth(); toast('已保存')
    } catch (e) { toast(e.message) }
  }

  async function removeItem(item) {
    if (!confirm('移到回收站？（可在回收站恢复）\n\n' + item.text.slice(0, 120))) return
    try { await api('/api/forget', { method: 'POST', body: JSON.stringify({ id: item.id }) }); await refreshList(); await loadHealth(); toast('已移到回收站') } catch (e) { toast(e.message) }
  }

  async function saveFocus() {
    const text = $('focusText').value.trim()
    const steps = $('focusSteps').value.split(/[,，\n]/).map(s => s.trim()).filter(Boolean)
    try {
      if (!text) { await api('/api/current', { method: 'POST', body: JSON.stringify({ clear: true }) }); toast('已清除焦点') }
      else { await api('/api/current', { method: 'POST', body: JSON.stringify({ focus: text, nextSteps: steps }) }); toast('焦点已保存') }
      await loadFocus(); await loadHealth()
    } catch (e) { toast(e.message) }
  }

  async function clearFocus() { try { await api('/api/current', { method: 'POST', body: JSON.stringify({ clear: true }) }); await loadFocus(); toast('已清除') } catch (e) { toast(e.message) } }

  async function exportAll() {
    try {
      const headers = state.token ? { authorization: 'Bearer ' + state.token } : {}
      const res = await fetch(BASE + '/api/export', { headers })
      if (!res.ok) throw new Error('HTTP ' + res.status)
      const blob = await res.blob()
      const a = document.createElement('a')
      a.href = URL.createObjectURL(blob)
      a.download = 'shared-memory-export.jsonl'
      a.click()
      setTimeout(() => URL.revokeObjectURL(a.href), 2000)
      toast('已导出 JSONL')
    } catch (e) { toast(e.message) }
  }

  async function loadBackups() {
    try {
      const j = await api('/api/backups')
      const parts = ['目录：' + (j.backupDir || '—'), '自动备份：' + (j.autoBackupHours ? '每 ' + j.autoBackupHours + ' 小时' : '关闭'), '保留：' + j.keep + ' 份']
      if (j.lastBackupAt) parts.push('上次：' + fmt(j.lastBackupAt))
      $('backupMeta').textContent = parts.join(' · ')
      const list = $('backupList')
      list.textContent = ''
      if (!j.items || !j.items.length) {
        list.append(el('div', 'empty', '还没有备份'))
        return
      }
      for (const item of j.items) {
        const row = el('div', 'rev')
        const bits = [new Date(item.createdAt).toLocaleString('zh-CN')]
        if (item.bytes) bits.push(Math.max(1, Math.round(item.bytes / 1024)) + ' KB')
        if (item.counts) bits.push(item.counts.memories + ' 条记忆 / ' + item.counts.messages + ' 条原话')
        row.append(el('div', 'meta', bits.join(' · ')))
        const btn = el('button', 'small', '恢复')
        btn.onclick = () => restoreBackup(item.name)
        row.append(btn)
        list.append(row)
      }
    } catch (e) { toast(e.message) }
  }

  async function backupNow() {
    try {
      await api('/api/backup', { method: 'POST', body: JSON.stringify({ reason: 'manual' }) })
      await loadBackups()
      toast('已创建备份')
    } catch (e) { toast(e.message) }
  }

  async function restoreBackup(name) {
    if (!confirm('从这个备份恢复？当前数据会先自动备份一份，然后被覆盖。')) return
    try {
      const result = await api('/api/restore-backup', { method: 'POST', body: JSON.stringify({ name }) })
      await refreshList(); await loadFocus(); await loadHealth(); await loadBackups()
      toast('已恢复：' + result.records + ' 条记忆')
    } catch (e) { toast(e.message) }
  }

  function setView(view) {
    state.view = view; state.offset = 0; state.editing = null; state.historyFor = null
    $('tabActive').classList.toggle('active', view === 'active')
    $('tabTrash').classList.toggle('active', view === 'trash')
    $('emptyTrash').classList.toggle('hidden', view !== 'trash')
    refreshList()
  }

  let searchTimer = null
  function bind() {
    $('tabActive').onclick = () => setView('active')
    $('tabTrash').onclick = () => setView('trash')
    $('emptyTrash').onclick = emptyTrash
    $('backupNow').onclick = backupNow
    $('refreshBackups').onclick = loadBackups
    $('sortMode').onchange = (ev) => { state.sort = ev.target.value; refreshList() }
    $('refreshBtn').onclick = () => { refreshList(); loadFocus(); loadHealth() }
    $('exportBtn').onclick = exportAll
    $('tokenBtn').onclick = () => $('tokenPanel').classList.toggle('show')
    $('tokenSave').onclick = async () => { state.token = $('tokenInput').value.trim(); localStorage.setItem('sm-token', state.token); $('tokenPanel').classList.remove('show'); toast('token 已保存'); await refreshList(); await loadFocus(); await loadHealth() }
    $('tokenClear').onclick = async () => { state.token = ''; $('tokenInput').value = ''; localStorage.removeItem('sm-token'); toast('token 已清除'); await refreshList() }
    $('focusSave').onclick = saveFocus
    $('focusClear').onclick = clearFocus
    $('moreBtn').onclick = loadMore
    $('search').oninput = (ev) => {
      clearTimeout(searchTimer)
      searchTimer = setTimeout(() => { state.q = ev.target.value.trim(); refreshList() }, 250)
    }
    $('kindFilter').onchange = (ev) => { state.kind = ev.target.value; refreshList() }
  }

  bind()
  refreshList(); loadHealth(); loadFocus(); loadBackups()
})()
</script>
</body>
</html>
