<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Shared Memory architecture">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
      .box-dark{fill:#0f172a;stroke:#1e293b;stroke-width:1.5}
      .t{font-family:'PingFang SC','Hiragino Sans GB',system-ui,-apple-system,'Segoe UI',sans-serif}
      .h{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12.5px;fill:#64748b}
      .hl{font-size:15px;font-weight:700;fill:#ffffff}
      .hs{font-size:12.5px;fill:#94a3b8}
      .lbl{font-size:11.5px;fill:#94a3b8}
    </style>
  </defs>

  <rect width="1200" height="640" fill="#f8fafc"/>
  <text class="t" x="40" y="48" font-size="22" font-weight="800" fill="#0f172a">共享记忆 · 架构总览</text>
  <text class="t" x="40" y="74" font-size="13" fill="#64748b">一个本地优先的记忆层：DSH 插件负责读写与注入，MCP 桥 / HTTP 让其他 AI 应用接入，备份目录兜底数据安全。</text>
  <rect x="40" y="88" width="1120" height="3" rx="1.5" fill="url(#hdr)"/>

  <!-- Apps -->
  <g class="t">
    <text class="lbl" x="60" y="130">AI 应用</text>
    <rect class="box" x="40" y="146" width="200" height="64" rx="12"/>
    <text class="h" x="60" y="174">DeepSeek Harness</text><text class="s" x="60" y="194">插件 · 自动捕获 + 注入</text>

    <rect class="box" x="40" y="226" width="200" height="64" rx="12"/>
    <text class="h" x="60" y="254">Cursor / Claude / Codex</text><text class="s" x="60" y="274">MCP stdio 桥</text>

    <rect class="box" x="40" y="306" width="200" height="64" rx="12"/>
    <text class="h" x="60" y="334">WorkBuddy</text><text class="s" x="60" y="354">MCP · 信任后直连</text>

    <rect class="box" x="40" y="386" width="200" height="64" rx="12"/>
    <text class="h" x="60" y="414">任意脚本 / 浏览器</text><text class="s" x="60" y="434">HTTP API · /dsh-memory</text>
  </g>

  <!-- DSH core -->
  <g class="t">
    <rect class="box-dark" x="330" y="120" width="470" height="430" rx="18"/>
    <text class="hl" x="360" y="156">DeepSeek Harness · SharedMemoryStore</text>
    <text class="hs" x="360" y="178">单写者 · 串行写链 · 原子落盘</text>

    <rect x="360" y="198" width="200" height="66" rx="10" fill="#1e293b" stroke="#334155"/>
    <text class="hl" x="380" y="224">会话捕获</text><text class="hs" x="380" y="244">user/message · 30 天 / 3000 条</text>

    <rect x="570" y="198" width="200" height="66" rx="10" fill="#1e293b" stroke="#334155"/>
    <text class="hl" x="590" y="224">自动抽取</text><text class="hs" x="590" y="244">rules / llm → 待确认</text>

    <rect x="360" y="282" width="200" height="66" rx="10" fill="#1e293b" stroke="#334155"/>
    <text class="hl" x="380" y="308">BM25 索引</text><text class="hs" x="380" y="328">bigram + 英文词 + 标签</text>

    <rect x="570" y="282" width="200" height="66" rx="10" fill="#1e293b" stroke="#334155"/>
    <text class="hl" x="590" y="308">提示注入</text><text class="hs" x="590" y="328">摘要 ≤1200 字 + 相关记忆</text>

    <rect x="360" y="366" width="200" height="66" rx="10" fill="#1e293b" stroke="#334155"/>
    <text class="hl" x="380" y="392">memory_* 工具</text><text class="hs" x="380" y="412">remember / search / update …</text>

    <rect x="570" y="366" width="200" height="66" rx="10" fill="#1e293b" stroke="#334155"/>
    <text class="hl" x="590" y="392">安全写入</text><text class="hs" x="590" y="412">PII 脱敏 · 注入过滤</text>

    <rect x="360" y="450" width="410" height="66" rx="10" fill="#1e293b" stroke="#334155"/>
    <text class="hl" x="380" y="476">HTTP API + UI</text><text class="hs" x="380" y="496">/health · /api/* · /ui · runtime.json</text>
  </g>

  <!-- arrows apps -> core -->
  <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="178" x2="324" y2="178"/>
    <line x1="240" y1="258" x2="324" y2="258"/>
    <line x1="240" y1="338" x2="324" y2="338"/>
    <line x1="240" y1="418" x2="324" y2="418"/>
  </g>

  <!-- Store -->
  <g class="t">
    <text class="lbl" x="850" y="130">本地存储</text>
    <rect class="box" x="840" y="146" width="320" height="140" rx="12"/>
    <text class="h" x="862" y="176">~/.dsh/shared-memory/</text>
    <text class="s" x="862" y="200">memories.jsonl · focus.json</text>
    <text class="s" x="862" y="222">activity.json · usage.json</text>
    <text class="s" x="862" y="244">candidates.json · runtime.json</text>
    <text class="s" x="862" y="266">digest.md · mcp-server.mjs</text>

    <rect class="box" x="840" y="306" width="320" height="118" rx="12"/>
    <text class="h" x="862" y="336">备份与恢复</text>
    <text class="s" x="862" y="360">~/.dsh/shared-memory-backups/</text>
    <text class="s" x="862" y="382">默认每 24h · 保留 14 份</text>
    <text class="s" x="862" y="404">恢复前自动 before-restore 快照</text>

    <rect class="box" x="840" y="444" width="320" height="86" rx="12"/>
    <text class="h" x="862" y="474">MCP 桥 / 独立 Hub</text>
    <text class="s" x="862" y="498">mcp-server.mjs · standalone/server.mjs</text>
    <text class="s" x="862" y="518">与 DSH 二选一，单写者</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="804" y1="200" x2="836" y2="200"/>
    <line x1="804" y1="470" x2="836" y2="470"/>
  </g>
  <text class="t lbl" x="810" y="226" font-size="10.5">读写</text>
  <text class="t lbl" x="806" y="498" font-size="10.5">启动/连接</text>
</svg>
