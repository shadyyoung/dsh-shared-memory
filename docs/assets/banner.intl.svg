<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Shared Memory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111c33"/>
      <stop offset="1" stop-color="#1b1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <circle cx="1080" cy="70" r="260" fill="url(#glow)"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="72" y="84" font-size="19" fill="#7dd3fc" letter-spacing="3">DEEPSEEK HARNESS PLUGIN · MCP</text>
    <text x="72" y="156" font-size="54" font-weight="800" fill="#ffffff">Shared Memory</text>
    <text x="72" y="216" font-size="30" font-weight="700" fill="url(#accent)">One memory. Every AI app.</text>
    <text x="72" y="258" font-size="21" fill="#9fb0c9">Preferences, projects and "what I'm doing right now" — across sessions and apps.</text>

    <g font-size="16" fill="#dbeafe">
      <rect x="72" y="278" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="94" y="298">Auto capture</text>
      <rect x="212" y="278" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="234" y="298">BM25 search</text>
      <rect x="352" y="278" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="374" y="298">Relevant injection</text>
      <rect x="514" y="278" width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="536" y="298">Auto backup</text>
    </g>
  </g>

  <g transform="translate(950 150)" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-opacity="0.9">
    <circle cx="0" cy="0" r="34" fill="#8b5cf6" fill-opacity="0.16"/>
    <circle cx="-92" cy="-64" r="18" fill="#38bdf8" fill-opacity="0.14"/>
    <circle cx="86" cy="-58" r="22" fill="#38bdf8" fill-opacity="0.14"/>
    <circle cx="-86" cy="66" r="16" fill="#34d399" fill-opacity="0.14"/>
    <circle cx="92" cy="70" r="20" fill="#34d399" fill-opacity="0.14"/>
    <line x1="-30" y1="-20" x2="-76" y2="-52"/>
    <line x1="30" y1="-20" x2="72" y2="-48"/>
    <line x1="-28" y1="22" x2="-72" y2="56"/>
    <line x1="30" y1="24" x2="76" y2="58"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
  </g>
</svg>
